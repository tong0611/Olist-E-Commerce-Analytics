# Local "production" source database for the Olist store.
services:
  postgres:
    image: postgres:16
    container_name: olist-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-olist}
      POSTGRES_USER: ${PG_USER:-olist}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-olist}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-olist} -d ${PG_DB:-olist}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
